system:
  # HTTP 开着时本文件只给页面反显默认值；点启动/保存后策略跟页面走。
  # HTTP 关着时本文件就是运行时配置（纯后端测试）。
  data_freshness_ms: 3000
  # 文本日志按天滚动。Linux 拷回：scp user@host:/opt/dex-arbitr/data/logs/*.log .
  log_dir: data/logs

# 进程连接这些适配器。页面默认不勾选；点「启动套利」时再选手动参与的所。
venues:
  - lighter
  - lighter_rh
  - sodex
  - entropy

pairs:
  defaults:
    max_segments: 5
    # 一格开平目标净利（bp）。1 bp = 0.01%。阶段 1：Δ = 目标% + 四腿 taker + 两所点差平均。阶段 2：Δ = 目标% + 2×(挂单所 maker + 市价所 taker) + 市价所点差中枢。
    target_bp: "1"
    split_order_size: "0"
  # HTTP 开着时这里只是页面初始行，启动进程不会去各所拉市场。
  # 点「启动套利」后按用户填写的 symbol + 所选所再匹配。空列表 = 只监控不交易。
  enabled:
    - symbol: BTC
      base_qty: "0.001"
      max_segments: 3
      overrides:
        - venues: [lighter, entropy]
          max_segments: 6
    - symbol: ETH
      base_qty: "0.02"

# 定仓已取消。这里只校验「按配置的每格数量开得起吗」。
# depth_pct：单笔下单量不得超过一档量的这个比例。
sizing:
  leverage_multiplier: "5"
  depth_pct: "50"
  # 余额和交易所持仓一起拉。1 = 顶栏 DEX 余额与「交易所持仓」每秒更新。
  # 停止套利后仍继续刷新，不依赖套利开关。
  refresh_balance_secs: 5
  margin_utilization_pct: "90"
  # SoDEX 公开余额接口可能为空；有真实余额时以 bridge 为准
  fallback_available_usdc: "500"

# 扫描环：analysis_interval_ms / watch_top。旧毛价差门槛与天然基差已拆。
# scan.enabled: false 且 execution.enabled: false 时走事件格子环。
# HTTP 开着时是否交易看页面「启动套利」；扫描看「启动扫描」。
execution:
  enabled: false
  loop_interval_ms: 100
  # 仅本进程第二腿失败后补对冲；启动前已有仓位只告警、不自动下单
  hedge_failed_legs: true

live_test:
  # true = DEX 单所小额验证（主流程下单受 max_qty 限制）；价差套利正常运行时 false
  dex_test_mode: false
  max_qty: "0.001"
  journal_path: data/executions.sqlite

http:
  enabled: true
  # auth_token 为空时程序会拒绝对外监听，自动回落到 127.0.0.1
  # （/api/positions 会暴露余额、持仓、裸敞口）。要公网访问就设 token。
  bind: "127.0.0.1:8090"
  web_root: web/dist
  auth_token: ""

scan:
  enabled: false
  analysis_interval_ms: 50
  watch_top: 20
  window_samples: 120
  max_own_spread_pct: "0.15"
  min_level_notional_usdc: "200"
  min_volume_24h_usdc: "3000000"
  coarse_refresh_secs: 60

grid:
  # 决策环 100ms 一拍则 1 秒大约查 10 次。min_hits = 这 1 秒里至少几次达标即通过（5 或 7）。0 = 连续不掉线。
  persistence_ms: 1000
  persistence_min_hits: 7
  # 满这么多个秒级点才有 μ（跨所 mid 价差）和各所点差中枢。1000 ≈ 17 分钟；代码默认 10000 ≈ 2h47m。两所中枢平均折进 Δ。
  window_samples: 300
  sample_interval_ms: 1000
  # STEP 滞后（格）。加仓 raw ≥ k+1−h，减仓 raw ≤ k−1+h。
  step_hysteresis: "0"
  # true = 阶段 2：满窗后在 μ±Δ 挂邻档第一腿，成交推进 STEP。
  symmetric_limit: false
  quote_reprice_ratio: "0.2"
  min_quote_gap_ratio: "0.3"

# 邻档不走 limit_timeout_ms。市价 / IOC / 撤后确认：等该单推送
# ioc_fill_wait_ms，没有再查一次。页面可热改（2000 / 3000 均可）。
order:
  limit_timeout_ms: 2000
  adjacent_timeout_ms: 0
  # maker 腿往点差内侧挪几个 tick。0 = 贴自家 bid/ask（队尾，2 秒超时几乎
  # 不可能成交）。参考项目的 tick 模式就是买 Ask1−1tick、卖 Bid1+1tick。
  maker_inside_ticks: 1
  # 第一腿限价最多挂几轮：每轮用最新盘口重算价格，部分成交累积，
  # 每轮结束一定撤掉余量。撤不掉会上报 orphan 并停止重试。
  limit_retry_count: 3
  ioc_fill_wait_ms: 2000

cost:
  # 决策不预扣滑点（小额只看卖一/买一）。成交后按实际成交价扣；超过本值记 overrun。
  default_slip_pct: "0.1"
  # ── 市价单滑点保护（对齐参考 order_execution.max_slippage）──
  # 以**决策信号价**为基准，超出这个幅度交易所直接拒单。
  # 这是唯一的穿档保护：不在本地遍历订单簿估 VWAP，而是把限价交给交易所
  # 强制执行——参考项目同样不做走档计算。
  max_slippage_pct: "1"
  # 平仓 / 紧急平仓 / 补对冲时把上面的上限放大这么多倍。
  # 对齐参考的「紧急平仓 50 倍滑点」：平不掉的风险远大于穿档成本。
  emergency_slippage_multiplier: "50"

# SQLite 天然价差。开关/窗长/采样间隔用代码默认；页面只热改 min_points（样本数）。
history:
  db_path: data/spreads.sqlite
  min_points: 10
  max_age_secs: 200
