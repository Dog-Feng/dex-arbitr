system:
  monitor_only: false
  data_freshness_ms: 3000
  stable_depeg_bps: 20
  # 文本日志按天滚动。Linux 拷回：scp user@host:/opt/dex-arbitr/data/logs/*.log .
  log_dir: data/logs

venues:
  - lighter
  - lighter_rh
  - sodex

pairs:
  # 空 = 各所两两交集全部进入扫描。要只盯少数币时写成 [BTC, ETH]。
  whitelist: []

# 对齐参考套利监控 V2：毛价差 ≥ 0.1% 记为机会，分析环扫内存盘口。
# 不改格子、不下单。scan.enabled: false 则回到旧的单币格子监控。
# execution.enabled: true → 统一决策环（格子 + 定仓 + 下单），不再走纯 scan 监控。
execution:
  enabled: true
  loop_interval_ms: 100
  paper_trading: false

# 定仓模式：
#   fixed  — 初期测试：每笔固定 USDC 名义（fixed_notional_usdc）
#   margin — 稳定后：按保证金短板 × 杠杆定仓（默认）
sizing:
  mode: fixed
  fixed_notional_usdc: "20"
  max_concurrent_pairs: 1
  leverage_multiplier: "2"
  min_notional_usdc: "20"
  max_notional_usdc: "100"
  depth_pct: "50"
  refresh_balance_secs: 60
  margin_utilization_pct: "90"
  # SoDEX 公开余额接口可能为空；有真实余额时以 bridge 为准
  fallback_available_usdc: "500"

live_test:
  # true = DEX 单所小额验证（主流程下单受 max_qty 限制）；价差套利正常运行时 false
  dex_test_mode: false
  max_qty: "0.001"
  journal_path: data/executions.sqlite

http:
  enabled: true
  bind: "0.0.0.0:8090"
  web_root: web
  # 公网暴露时建议设置；留空则 /api 无需鉴权
  auth_token: ""

scan:
  enabled: false
  min_spread_pct: "0.1"
  analysis_interval_ms: 50
  watch_top: 20
  # SoDEX 与 Lighter 不同链，raw 里常有天然基差。true = 跨 DEX 上榜看 residual = raw − max(nat,0)
  cross_use_natural: true
  # 控制台和文件同一套：只打每个币的关键行。上榜/下榜立刻记，仍在榜上至少隔这么多秒。
  log_interval_secs: 30

grid:
  # T1：净边达到该值才开第一格。单位是百分比，0.03 = 0.03%
  initial_spread_threshold: "0.03"
  # 之后每扩大一格再加一份仓的间隔。第 n 格门槛 = T1 + (n-1) × grid_step
  # 现在 max_segments=1，这一项还不会加仓，只影响以后开多格
  grid_step: "0.03"
  max_segments: 1
  persistence_ms: 1000
  base_qty:
    BTC: "0.001"
    ETH: "0.02"

# limit_then_market：吃单费率高的一所先挂限价，成交后再对另一所市价。
# 挂着期间价差不够了就撤；若已经成交，另一边仍市价对冲，避免单边。
# market_taker：双腿同时市价。limit_maker：双腿限价。
order:
  style: limit_then_market
  limit_timeout_ms: 2000

cost:
  # 决策不预扣滑点（小额只看卖一/买一）。成交后按实际成交价扣；超过本值记 overrun。
  default_slip_pct: "0.01"

# 对齐参考项目：SQLite 记毛价差，中位数当天然价差。
# 开仓看 净边 − max(天然, 0) ≥ T1。无 nat 快照时只记录、不开仓。
history:
  enabled: true
  db_path: data/spreads.sqlite
  sample_interval_secs: 5
  window_hours: 24
  min_points: 10
  # 有 natural_spreads 快照则启动直接用；之后隔这么久重算 24h 中位数（1800 = 30 分钟）。
  refresh_interval_secs: 1800
  max_age_secs: 200

risk:
  min_book_qty:
    BTC: "0.001"
    ETH: "0.01"
