# ANTH (Entropy io x Lighter ANTHROPIC) - z-score + step_z ladder variant.
# Base: anth-live.yaml. Switches: estimator.kind zscore, strategy.kind zscore,
# z_open / step_z. Original file stays unchanged; launch with:
#   arbd -config configs/anth-live-zscore.yaml
#
# z-score mode ignores: estimator.window / estimator.min_coverage /
# strategy.open_bps / strategy.vol_k / volume.*  (kept below, commented).
# Still effective: close_bps, depth_mult, close_order, flip/cap hysteresis,
# volatility.* (readiness gate), execution.*, risk.*, intervals, max_steps.
dry_run: true
state_dir: state-anth
leverage: 3
samples_dir: state-anth/samples

venues:
  - name: rhlighter
    kind: rhlighter      # RH Lighter mainnet, chain id 466324
    opts:
      account_index: ${RH_ACCOUNT_INDEX}
      api_key_index: ${RH_API_KEY_INDEX}
      private_key: ${RH_PRIVATE_KEY}
  - name: entropy
    kind: entropy        # Hyperliquid HIP-3 dex "io"
    opts:
      account: ${ENTROPY_ACCOUNT}
      private_key: ${ENTROPY_AGENT_KEY}
      book_depth: 20

matching:
  strip_suffixes: [PERP, USDC, USDG, USDT, USD]
  separators: "-_/: ."
  aliases:
    ANTH: ANTHROPIC     # Entropy lists ANTH, Lighter lists ANTHROPIC

estimator:
  kind: zscore
  min_warmup: 15m
  interval: 1s
  mu_half_life: 15m      # mean EMA half-life (fast anchor)
  sigma_half_life: 3h    # dispersion EWMA half-life (z normalization)
  sigma_floor: 0.5       # dispersion floor in bps
  # window / min_coverage are unused by the zscore estimator.

volatility:
  interval: 100ms
  horizon: 500ms
  half_life: 1m
  max_age: 600ms

risk:
  margin_floor_ratio: 0.2
  margin_trigger_ratio: 0.1
  margin_hysteresis: 0.05
  position_refresh: 15s
  emergency_market_bps: 100
  max_notional: 0

strategy:
  kind: zscore
  pair_selection: manual
  z_open: 2             # z threshold for opens
  step_z: 0.5           # z ladder per step (0.5~1.0; 0 = off)
  close_bps: 0          # still used: close when gross >= close_bps + closeFeeBps
  depth_mult: 3
  close_order: best
  flip_hysteresis_sigma: 1.0   # extra sigma of z before reversing from flat
  cap_band: 1                  # reopen below max_steps-cap_band after touching cap
  cap_hysteresis_sigma: 1.0    # extra sigma of z inside the top cap_band steps
  interval_min: 1s
  interval_max: 2s
  max_book_age: 3s
  # open_bps / vol_k are ignored in zscore mode (replaced by z_open / step_z).

auto:
  top_y: 5
  max_steps: 3
  notional_per_leg: 200
  depth_use_ratio: 0.25
  min_churn_score: 0
  promote_margin: 0.05
  dwell: 1m
  max_fail_rate: 0.3
  max_total_notional: 0
  candidates: []

execution:
  price_ticks: 30
  dynamic_ticks: true
  tick_k: 2.5
  min_ticks: 1
  max_ticks: 0
  depth_min_mult: 5
  depth_max_scale: 4
  topup_bps: 25
  adaptive_latency:
    enabled: true
    min_samples: 8
    window_min: 200ms
    window_max: 3s
    coverage_k: 1.3
    ring_n: 32
    update_interval: 1s

adaptive:
  window: 50
  fail_high: 0.10
  fail_low: 0.02
  up_factor: 1.3
  down_factor: 0.95
  min_k: 0.5
  max_k: 3

monitor:
  addr: ""
  token: ""
  analytics:
    bucket: "0"           # 0 = analytics off
    retain_buckets: 672
    sessions: {}
    anomalies:
      consecutive_fails: 0
      flips_window_min: 0
      flips_threshold: 0
      full_load_headroom: 0
      full_load_minutes: 0
      oldest_step_minutes: 0
      loss_bucket_count: 0
      loss_per_bucket_usd: 0
      rescue_slip_usd: 0
      latency_p95_ms: 0
      silent_minutes: 0
      risk_flaps_per_hour: 0
      mu_jump_sigma: 0

pairs:
  - base: ANTH
    left: rhlighter
    right: entropy
    step_qty: 0.01
    max_steps: 50       # ladder self-limits frozen steps to ~17-33 in backtests
