# Cross-DEX perp spread step arbitrage. Secrets come from environment variables.
dry_run: true            # true = paper trading (no orders). Set false for live.
state_dir: state
leverage: 10            # account leverage, applied to every venue (1x..10000x)
samples_dir: state/samples   # append 100ms spread samples for offline calibration (empty = off)

venues:
  - name: lighter
    kind: lighter        # Lighter mainnet, chain id 304
    opts:
      account_index: ${LIGHTER_ACCOUNT_INDEX}
      api_key_index: ${LIGHTER_API_KEY_INDEX}
      private_key: ${LIGHTER_PRIVATE_KEY}
  - name: rhlighter
    kind: rhlighter      # RH Lighter mainnet, chain id 466324
    opts:
      account_index: ${RH_ACCOUNT_INDEX}
      api_key_index: ${RH_API_KEY_INDEX}
      private_key: ${RH_PRIVATE_KEY}

matching:
  strip_suffixes: [PERP, USDC, USDG, USDT, USD]   # USDC/USDG/USDT treated 1:1
  separators: "-_/: ."

estimator:
  kind: sma
  window: 2h
  min_warmup: 60m
  min_coverage: 0.8
  interval: 1s

volatility:
  interval: 100ms       # sampling interval for the spread series
  horizon: 500ms        # increment horizon whose volatility is estimated
  half_life: 1m         # EWMA half-life of realized variance
  max_age: 50ms         # drop samples when either book is older than this

risk:
  margin_floor_ratio: 0.2     # stop opening when any leg's remaining margin <= 20%
  margin_trigger_ratio: 0.1   # emergency unwind when remaining margin <= 10%
  margin_hysteresis: 0.05     # recovery band above the floor
  position_refresh: 15s       # liquidation price refresh interval
  emergency_market_bps: 100   # protective bound of the emergency market unwind
  max_notional: 0             # per-venue aggregate notional cap (USD); 0 = unlimited

strategy:
  kind: volume           # arbitrage | volume (registered strategies)
  pair_selection: manual # manual | auto (auto = picker-driven top-Y from shared stats)
  open_bps: 0          # arbitrage: extra edge above fees/volatility; volume always uses 0
  close_bps: 0         # arbitrage: extra net return target; volume always uses 0
  depth_mult: 2        # top-of-book qty >= step_qty * 2 on both legs
  close_order: best    # best | lifo | fifo
  vol_k: 0.5          # one-sided sigma buffer added to open_bps 1.28
  interval_min: 1s
  interval_max: 2s
  max_book_age: 10s

volume:                     # only used when strategy.kind = volume
  min_inventory: 0          # floor steps held while churning
  daily_volume_target: 0    # USD; 0 = unlimited
  daily_cost_budget: 0      # USD max daily loss; 0 = unlimited
  loss_tolerance_bps: 0     # legacy compatibility field; volume requires 0

auto:                       # only used when strategy.pair_selection = auto
  top_y: 5                  # number of active pairs
  max_steps: 3              # steps allowed per active pair
  notional_per_leg: 200     # USD notional cap per leg
  depth_use_ratio: 0.25     # max fraction of top-of-book depth used for sizing
  min_churn_score: 0        # pairs below this score are never selected (0 = ordering only)
  promote_margin: 0.05      # relative score lead required to displace an active pair
  dwell: 1m                 # sustained lead/lag before promoting/demoting
  max_fail_rate: 0.3        # one-leg failure rate above which a pair is disabled
  max_total_notional: 0     # account-level notional budget (USD); 0 = unlimited
  candidates: []            # optional base whitelist; empty = all matched pairs

execution:
  price_ticks: 30      # fixed IOC allowance; fallback while sigma is not ready
  dynamic_ticks: true  # scale the allowance by sigma (volatility.horizon)
  tick_k: 2.5          # one-sided coverage coefficient (leg-price vol); calibrate by replay
  min_ticks: 1
  max_ticks: 0         # 0 = no upper clamp
  depth_min_mult: 5    # depth multiple below which the allowance widens
  depth_max_scale: 4   # max multiplier on thin books

adaptive:
  window: 50            # outcomes before adjusting tick_k; 0 = disabled
  fail_high: 0.10      # widen when the one-leg failure rate exceeds this
  fail_low: 0.02       # tighten when below this
  up_factor: 1.3
  down_factor: 0.95
  min_k: 0.5
  max_k: 10

monitor:
  addr: ":8080"            # HTTP metrics endpoint; empty = disabled
  token: ${SECRETS}                # bearer token; empty = no auth (use ${ENV} for secrets)

pairs:
  - base: SPY
    left: lighter
    right: rhlighter
    step_qty: 0.02
    max_steps: 15
  - base: QQQ
    left: lighter
    right: rhlighter
    step_qty: 0.02
    max_steps: 15
