# Cross-DEX perp spread step arbitrage. Secrets come from environment variables.
dry_run: true            # true = paper trading (no orders). Set false for live.
state_dir: state
leverage: 5            # account leverage, applied to every venue (1x..10000x)
samples_dir: state/samples   # append 100ms spread samples for offline calibration (empty = off)

venues:
  - name: lighter
    kind: lighter        # Lighter mainnet, chain id 304
    opts:
      account_index: ${LIGHTER_ACCOUNT_INDEX}
      api_key_index: ${LIGHTER_API_KEY_INDEX}
      private_key: ${LIGHTER_PRIVATE_KEY}
  - name: rhlighter
    kind: rhlighter      # RH Lighter mainnet, chain id 466324
    opts:
      account_index: ${RH_ACCOUNT_INDEX}
      api_key_index: ${RH_API_KEY_INDEX}
      private_key: ${RH_PRIVATE_KEY}
  # Entropy (io) is a HIP-3 builder dex on Hyperliquid: the standard
  # Hyperliquid API is used with dex=io. Collateral is per-dex USDC, so fund
  # the io balance before trading. account = main address; private_key = the
  # approved API-wallet (agent) key. Optional network: mainnet|testnet selects
  # the signing source; empty infers it from the exchange URL host.
  - name: entropy
    kind: entropy
    opts:
      account: ${ENTROPY_ACCOUNT}
      private_key: ${ENTROPY_AGENT_KEY}
      book_depth: 20

matching:
  strip_suffixes: [PERP, USDC, USDG, USDT, USD]   # USDC/USDG/USDT treated 1:1
  separators: "-_/: ."
  # Symbol canonicalization across venues, e.g. ANTH: ANTHROPIC.
  # Built-in defaults (ANTH->ANTHROPIC, OAI->OPENAI) apply unless overridden.
  aliases: {}

estimator:
  kind: zscore              # sma | zscore (zscore: EMA mean + long-horizon dispersion gate)
  window: 2h                # zscore 下不生效（仅 sma 使用，可留作切换回退）
  min_warmup: 15m
  # z-score estimator options (used when kind: zscore):
  mu_half_life: 15m        # mean EMA half-life
  sigma_half_life: 3h      # dispersion EWMA half-life
  sigma_floor: 0.5         # dispersion floor in bps
  min_coverage: 0.8         # zscore 下不生效（仅 sma 使用）
  interval: 1s

volatility:
  interval: 100ms       # sampling interval for the spread series
  horizon: 500ms        # increment horizon whose volatility is estimated
  half_life: 1m         # EWMA half-life of realized variance
  max_age: 600ms        # drop samples when either book is older than this (HL fast book ~0.5s)

risk:
  margin_floor_ratio: 0.2     # stop opening when any leg's remaining margin <= 20%
  margin_trigger_ratio: 0.1   # emergency unwind when remaining margin <= 10%
  margin_hysteresis: 0.05     # recovery band above the floor
  position_refresh: 15s       # liquidation price refresh interval
  emergency_market_bps: 100   # protective bound of the emergency market unwind
  max_notional: 0             # per-venue aggregate notional cap (USD); 0 = unlimited
  max_auto_resume_per_day: 1  # external-intervention auto-resumes per 24h; 0 = default (1)

strategy:
  # kind: zscore 与 arbitrage/volume 的区别：
  #   开仓门槛不再用固定 bps（open_bps + vol_k×σ），而是用长期价差离散度归一化：
  #     z = (当前价差 - 快速均值) / σ_long
  #   当 |z| >= z_open 且偏离仍覆盖往返手续费时才开仓；step_z 阶梯让每一步
  #   比前一步多要求 step_z 个 σ，把步数铺在偏离带上（0 = 关闭阶梯）。
  #   平仓规则与 arbitrage 完全相同（毛利 >= close_bps + 入场费摊销 + 出场费）。
  #   必须搭配 estimator.kind: zscore；open_bps / vol_k 在 zscore 下失效。
  kind: zscore           # arbitrage | volume | zscore
  pair_selection: manual # manual | auto (auto = picker-driven top-Y from shared stats)
  open_bps: 0          # arbitrage: extra edge above fees/volatility; volume always uses 0
  close_bps: 0         # arbitrage: extra net return target; volume always uses 0
  depth_mult: 3        # top-of-book qty >= step_qty * 2 on both legs
  close_order: best    # best | lifo | fifo
  vol_k: 1          # one-sided sigma buffer added to open_bps 1.28
  flip_hysteresis_sigma: 1.0  # extra sigma of deviation required before reversing direction (0 = off)
  cap_band: 2                # after touching max_steps, opens unlock below max_steps-cap_band (0 = off)
  cap_hysteresis_sigma: 1.0  # extra sigma to open inside the top cap_band steps (0 = off)
  z_open: 2                 # z-score open threshold (used when kind: zscore; 0 = default 2)
  step_z: 0.5               # z-score ladder: each step needs +0.5 sigma (0 = off)
  z_close: 0                # zscore: force close when same-direction z <= z_close; 2.7d backtest shows fee-negative, keep off
  close_hold: 180m          # force close any step held this long (0 = off); backtest optimum on ANTH
  forced_close_cooldown: 15m # suppress same-direction re-opens after a forced close (0 = off)
  interval_min: 1s
  interval_max: 2s
  max_book_age: 3s

volume:                     # only used when strategy.kind = volume
  min_inventory: 0          # floor steps held while churning
  loss_tolerance_bps: 0     # legacy compatibility field; volume requires 0

auto:                       # only used when strategy.pair_selection = auto
  top_y: 5                  # number of active pairs
  max_steps: 3              # steps allowed per active pair
  notional_per_leg: 200     # USD notional cap per leg
  depth_use_ratio: 0.25     # max fraction of top-of-book depth used for sizing
  min_churn_score: 0        # pairs below this score are never selected (0 = ordering only)
  promote_margin: 0.05      # relative score lead required to displace an active pair
  dwell: 1m                 # sustained lead/lag before promoting/demoting
  max_fail_rate: 0.3        # one-leg failure rate above which a pair is disabled
  max_total_notional: 0     # account-level notional budget (USD); 0 = unlimited
  candidates: []            # optional base whitelist; empty = all matched pairs

execution:
  price_ticks: 30      # fixed IOC allowance; fallback while sigma is not ready
  dynamic_ticks: true  # scale the allowance by sigma (volatility.horizon)
  tick_k: 2.5          # one-sided coverage coefficient (leg-price vol); calibrate by replay
  min_ticks: 1
  max_ticks: 0         # 0 = no upper clamp
  depth_min_mult: 5    # depth multiple below which the allowance widens
  depth_max_scale: 4   # max multiplier on thin books
  topup_bps: 25        # step-completion price allowance after a partial fill; 0 = disabled
  adaptive_latency:    # volatility window follows measured leg latency
    enabled: true     # false = fixed volatility.horizon
    min_samples: 8     # cold start: fixed window below this count
    window_min: 200ms  # lower clamp for the latency-derived window
    window_max: 3s     # upper clamp, also the estimator ring capacity
    coverage_k: 1.3    # one-sided coverage (mean + k*std)
    ring_n: 32         # latency sample ring size
    update_interval: 1s  # how often the window is re-derived

adaptive:
  window: 50            # outcomes before adjusting tick_k; 0 = disabled
  fail_high: 0.10      # widen when the one-leg failure rate exceeds this
  fail_low: 0.02       # tighten when below this
  up_factor: 1.3
  down_factor: 0.95
  min_k: 0.5
  max_k: 5

monitor:
  addr: ":8080"            # HTTP metrics endpoint; empty = disabled
  token: ${SECRETS}                # bearer token; empty = no auth (use ${ENV} for secrets)
  analytics:               # observational only: time buckets + anomaly rules (never affect trading)
    bucket: 15m            # aggregation granularity; 0 = off
    retain_buckets: 672    # in-memory retention (7 days @ 15m)
    sessions:              # display-only Beijing windows (name: HH:MM-HH:MM)
      us_cash: "21:30-04:00"
      us_premarket: "16:00-21:30"
      asia_day: "09:00-16:00"
    anomalies:             # non-positive threshold disables a rule
      consecutive_fails: 3
      flips_window_min: 10
      flips_threshold: 3
      full_load_headroom: 2
      full_load_minutes: 30
      oldest_step_minutes: 60
      loss_bucket_count: 3
      loss_per_bucket_usd: 0.05
      rescue_slip_usd: 0.01
      latency_p95_ms: 1200
      silent_minutes: 30
      risk_flaps_per_hour: 8
      mu_jump_sigma: 3

pairs:
  - base: ANTH
    left: rhlighter
    right: entropy
    step_qty: 0.01
    max_steps: 50
